<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Muhamad Arya Praseptya</title>
  <desc id="d">Software Engineer. Laravel, Flutter, and on-device machine learning.</desc>

  <defs>
    <radialGradient id="glow" cx="140" cy="0" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8A24A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C8A24A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }

    /* Masuk sekali saat dimuat. Tanpa animasi, semuanya tampil di posisi akhir. */
    .rise  { animation: rise 0.9s cubic-bezier(.22,.61,.36,1) both; }
    .d1 { animation-delay: .10s; }
    .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .70s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    .bar { stroke-dasharray: 56; animation: draw 1s .5s cubic-bezier(.22,.61,.36,1) both; }
    @keyframes draw { from { stroke-dashoffset: 56; } to { stroke-dashoffset: 0; } }

    /* Empat peran bergantian, masing-masing tampil sekitar 3 detik. */
    .role { opacity: 0; animation: cycle 12s infinite; }
    .r0 { opacity: 1; }
    .r1 { animation-delay: 3s; }
    .r2 { animation-delay: 6s; }
    .r3 { animation-delay: 9s; }
    @keyframes cycle {
      0%        { opacity: 0; transform: translateY(8px); }
      5%, 22%   { opacity: 1; transform: none; }
      27%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 40% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .bar, .role, .pulse { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0D0D0F"/>
    <rect width="1000" height="300" fill="url(#glow)"/>

    <!-- Lokasi -->
    <g class="rise">
      <line x1="64" y1="83" x2="84" y2="83" stroke="#C8A24A" stroke-opacity=".5"/>
      <text x="96" y="88" font-size="15" fill="#C8A24A">Kabupaten Bogor, Indonesia</text>
    </g>

    <!-- Nama -->
    <text class="rise d1" x="64" y="152" font-size="44" font-weight="700" fill="#EDEAE4"
          textLength="540" lengthAdjust="spacingAndGlyphs">Muhamad Arya Praseptya</text>

    <line class="bar" x1="64" y1="178" x2="120" y2="178" stroke="#C8A24A" stroke-width="3" stroke-linecap="round"/>

    <!-- Peran bergantian -->
    <circle class="pulse" cx="70" cy="215" r="4.5" fill="#C8A24A"/>
    <g font-size="26" fill="#EDEAE4">
      <text class="role r0" x="90" y="224">Software Engineer</text>
      <text class="role r1" x="90" y="224">Full-Stack Web Developer</text>
      <text class="role r2" x="90" y="224">Flutter Mobile Developer</text>
      <text class="role r3" x="90" y="224">Machine Learning Enthusiast</text>
    </g>

    <text class="rise d3" x="64" y="266" font-size="15" fill="#A7A49E">S1 Ilmu Komputer, Universitas Pakuan, 2026</text>

    <!-- Monogram: mengulang motif avatar (huruf A, kurung kurawal, panah naik) -->
    <g text-anchor="middle" fill="#C8A24A">
      <text x="770" y="222" font-size="112" font-weight="300" fill-opacity=".42">{</text>
      <text x="935" y="222" font-size="112" font-weight="300" fill-opacity=".42">}</text>
      <text x="852" y="224" font-size="120" font-weight="700">A</text>
    </g>
    <g stroke="#C8A24A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".85">
      <line x1="882" y1="118" x2="914" y2="88"/>
      <polyline points="896,86 914,88 912,106"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="299" rx="17.5" fill="none" stroke="#26262E"/>
</svg>
